<div class="modal fade" id="quickPromotionModal" tabindex="-1" aria-labelledby="quickPromotionTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <form class="modal-content" id="quickPromotionForm">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="quickPromotionTitle">Tạo khuyến mãi</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <fieldset class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="quickPromotionName">Tên khuyến mãi</label>
                        <input class="form-control" id="quickPromotionName" name="name" maxlength="150" required autocomplete="off" placeholder="VD: Giảm cuối tuần">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="quickPromotionCode">Mã khuyến mãi</label>
                        <input class="form-control text-uppercase" id="quickPromotionCode" name="code" maxlength="40" required autocomplete="off" autocapitalize="characters" placeholder="VD: SALE10">
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="quickPromotionType">Loại giảm</label>
                        <select class="form-select" id="quickPromotionType" name="discount_type">
                            <option value="percent">Phần trăm (%)</option>
                            <option value="amount">Số tiền (đ)</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="quickPromotionValue">Giá trị giảm</label>
                        <input class="form-control" id="quickPromotionValue" name="discount_value" type="number" min="1" max="100" step="1" inputmode="numeric" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="quickPromotionMinimum">Đơn tối thiểu (đ)</label>
                        <input class="form-control" id="quickPromotionMinimum" name="min_order_amount" type="number" min="0" step="1" inputmode="numeric" value="0" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="quickPromotionCap">Giảm tối đa (đ)</label>
                        <input class="form-control" id="quickPromotionCap" name="max_discount_amount" type="number" min="1" step="1" inputmode="numeric" placeholder="Không giới hạn">
                    </div>
                </fieldset>
                <p class="small text-muted mt-3 mb-0">{{ promotion_scope_help }}</p>
                <div id="quickPromotionError" class="small text-danger mt-2 d-none" role="alert"></div>
            </div>
            <div class="modal-footer flex-nowrap">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Hủy</button>
                <button type="submit" class="btn btn-success flex-grow-1" id="saveQuickPromotion">Tạo và áp dụng</button>
            </div>
        </form>
    </div>
</div>
