<script>
/* Catalog preview uses textContent for every value originating from an uploaded file. */
(() => {
    'use strict';
    const form = document.getElementById('catalogImportForm');
    if (!form) return;
    const modal = document.getElementById('catalogImportModal');
    const field = document.getElementById('catalogImportFile');
    const confirm = document.getElementById('catalogImportConfirm');
    const rescan = document.getElementById('catalogImportRescan');
    const status = document.getElementById('catalogImportStatus');
    const errors = document.getElementById('catalogImportErrors');
    const warnings = document.getElementById('catalogImportWarnings');
    const preview = document.getElementById('catalogImportPreview');
    const summary = document.getElementById('catalogImportSummary');
    const tbody = document.getElementById('catalogImportRows');
    const filter = document.getElementById('catalogImportFilter');
    const pageInfo = document.getElementById('catalogImportPageInfo');
    const prev = document.getElementById('catalogImportPrev');
    const next = document.getElementById('catalogImportNext');
    const labels = {create: 'Tạo mới', update: 'Cập nhật', unchanged: 'Không đổi', error: 'Có lỗi', warning: 'Có lưu ý'};
    const colors = {create: 'success', update: 'primary', unchanged: 'secondary', error: 'danger', warning: 'warning text-dark'};
    let token = '', scannedFile = null, rows = [], page = 0, generation = 0, controller = null, importing = false;
    const pageSize = 50;
    const money = (value) => value === null ? '—' : (value !== '' && Number.isFinite(Number(value)) ? new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 2}).format(Number(value)) : value);
    function element(tag, content, className = '') {
        const node = document.createElement(tag);
        node.textContent = content;
        node.className = className;
        return node;
    }
    function showMessages(container, messages) {
        container.replaceChildren();
        container.classList.toggle('d-none', !messages.length);
        if (messages.length) {
            const list = document.createElement('ul');
            list.className = 'mb-0 ps-3';
            messages.slice(0, 50).forEach((message) => list.append(element('li', message)));
            if (messages.length > 50) list.append(element('li', `Còn ${messages.length - 50} thông báo. Xem chi tiết tại từng dòng bên dưới.`));
            container.append(list);
        }
    }
    function setStatus(message, kind = 'light') {
        status.className = `alert alert-${kind} border small`;
        status.textContent = message;
    }
    function clearPreview() {
        token = ''; scannedFile = null; rows = []; page = 0;
        confirm.disabled = true;
        preview.classList.add('d-none');
        showMessages(errors, []); showMessages(warnings, []);
        summary.replaceChildren(); tbody.replaceChildren(); filter.value = 'all';
    }
    function renderRows() {
        const visible = rows.filter((row) => filter.value === 'all' || (filter.value === 'warning' ? row.warnings.length > 0 : row.action === filter.value));
        const start = page * pageSize;
        tbody.replaceChildren();
        visible.slice(start, start + pageSize).forEach((row) => {
            const tr = document.createElement('tr');
            if (row.action === 'error') tr.className = 'table-danger';
            tr.append(element('td', `${row.sheet}\n${row.row}`, 'text-muted text-nowrap'));
            const name = document.createElement('td');
            name.append(element('div', row.category || '—', 'text-muted'), element('div', row.product || '—', 'fw-semibold'));
            tr.append(name, element('td', row.unit || '—'));
            tr.append(element('td', row.price === null ? '—' : `${money(row.old_price)} → ${money(row.price)}`, 'text-end text-nowrap'));
            const result = document.createElement('td');
            result.style.minWidth = '230px';
            result.append(element('span', labels[row.action], `badge bg-${colors[row.action]} mb-1`));
            row.details.forEach((message) => result.append(element('div', message)));
            row.warnings.forEach((message) => result.append(element('div', `Lưu ý: ${message}`, 'text-warning-emphasis mt-1')));
            row.errors.forEach((message) => result.append(element('div', message, 'text-danger mt-1')));
            tr.append(result); tbody.append(tr);
        });
        if (!visible.length) {
            const tr = document.createElement('tr');
            const cell = element('td', 'Không có dòng phù hợp.', 'text-center text-muted py-3');
            cell.colSpan = 5; tr.append(cell); tbody.append(tr);
        }
        pageInfo.textContent = visible.length ? `${start + 1}–${Math.min(start + pageSize, visible.length)} / ${visible.length} dòng` : '0 dòng';
        prev.disabled = page === 0;
        next.disabled = start + pageSize >= visible.length;
    }
    async function readResponse(response) {
        if (response.redirected || !response.headers.get('Content-Type')?.includes('application/json')) {
            throw new Error('Phiên đăng nhập đã hết hạn hoặc bạn không có quyền nhập. Tải lại trang và đăng nhập rồi thử lại.');
        }
        return response.json();
    }
    async function scan() {
        if (importing) return;
        const current = ++generation;
        controller?.abort();
        clearPreview();
        const file = field.files[0];
        rescan.disabled = !file;
        if (!file) { setStatus('Chọn file để xem trước kết quả nhập.'); return; }
        if (!file.name.toLowerCase().endsWith('.xlsx') || file.size > 5 * 1024 * 1024) {
            setStatus('Chọn file .xlsx có dung lượng tối đa 5 MB.', 'danger'); return;
        }
        controller = new AbortController();
        setStatus('Đang quét file và đối chiếu dữ liệu hiện có… Chưa ghi dữ liệu.', 'info');
        preview.setAttribute('aria-busy', 'true');
        rescan.disabled = true;
        const data = new FormData(form);
        try {
            const response = await fetch(form.dataset.previewUrl, {method: 'POST', body: data, signal: controller.signal, headers: {Accept: 'application/json'}});
            const result = await readResponse(response);
            if (current !== generation) return;
            rows = result.rows || [];
            showMessages(errors, result.errors || []);
            showMessages(warnings, result.warnings || []);
            if (result.summary) {
                for (const key of ['create', 'update', 'unchanged', 'error', 'warning']) {
                    summary.append(element('span', `${labels[key]}: ${result.summary[key]}`, `badge bg-${colors[key]} py-2`));
                }
                summary.append(element('span', `Dự kiến thêm ${result.summary.categories_new} danh mục, ${result.summary.products_new} sản phẩm.`, 'small text-muted align-self-center'));
            }
            preview.classList.toggle('d-none', !rows.length);
            renderRows();
            if (response.ok && result.ok && result.preview_token) {
                token = result.preview_token; scannedFile = file;
                confirm.disabled = false;
                setStatus(`Đã quét ${rows.length} dòng. Chưa ghi dữ liệu. Kiểm tra kết quả bên dưới rồi xác nhận.`, 'success');
            } else {
                setStatus('Chưa thể nhập: sửa lỗi trong file rồi chọn lại hoặc bấm Quét lại. Chưa ghi dữ liệu.', 'danger');
            }
        } catch (error) {
            if (current !== generation || error.name === 'AbortError') return;
            setStatus(error instanceof TypeError ? 'Không kết nối được máy chủ. Bấm Quét lại để thử lại.' : error.message, 'danger');
        } finally {
            if (current === generation) {
                preview.setAttribute('aria-busy', 'false');
                rescan.disabled = !field.files.length;
            }
        }
    }
    field.addEventListener('change', scan);
    rescan.addEventListener('click', scan);
    filter.addEventListener('change', () => { page = 0; renderRows(); });
    prev.addEventListener('click', () => { page--; renderRows(); });
    next.addEventListener('click', () => { page++; renderRows(); });
    modal.addEventListener('hide.bs.modal', (event) => { if (importing) event.preventDefault(); });
    modal.addEventListener('hidden.bs.modal', () => {
        ++generation; controller?.abort(); form.reset(); clearPreview(); rescan.disabled = true;
        setStatus('Chọn file để xem trước kết quả nhập.');
    });
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (importing || !token || scannedFile !== field.files[0]) return;
        const data = new FormData(form);
        data.set('preview_token', token);
        importing = true;
        confirm.disabled = true; field.disabled = true; rescan.disabled = true;
        modal.querySelectorAll('[data-bs-dismiss="modal"]').forEach((button) => { button.disabled = true; });
        setStatus('Đang nhập dữ liệu… Vui lòng chờ kết quả.', 'info');
        try {
            const response = await fetch(form.action, {method: 'POST', body: data, headers: {Accept: 'application/json'}});
            const result = await readResponse(response);
            if (response.ok && result.ok) {
                setStatus(result.message, 'success');
                window.location.reload();
                return;
            }
            showMessages(errors, result.errors || ['Không nhập được file. Hãy quét lại.']);
            setStatus('Chưa nhập dữ liệu. Bấm Quét lại để kiểm tra kết quả mới.', 'danger');
        } catch (error) {
            setStatus('Chưa nhận được kết quả từ máy chủ. Hãy quét lại để đối chiếu dữ liệu trước khi thử nhập tiếp.', 'warning');
        } finally {
            token = ''; importing = false; field.disabled = false; rescan.disabled = false;
            modal.querySelectorAll('[data-bs-dismiss="modal"]').forEach((button) => { button.disabled = false; });
        }
    });
})();
</script>
