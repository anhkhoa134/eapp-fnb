{% if active %}
<span class="quanly-status-icon quanly-status-icon--active d-inline-flex align-items-center{% if extra_class %} {{ extra_class }}{% endif %}">
    <i class="bi bi-check-circle-fill" aria-hidden="true"></i><span>{{ active_label|default:'Đang bật' }}</span>
</span>
{% else %}
<span class="quanly-status-icon quanly-status-icon--inactive d-inline-flex align-items-center{% if extra_class %} {{ extra_class }}{% endif %}">
    <i class="bi bi-pause-circle-fill" aria-hidden="true"></i><span>{{ inactive_label|default:'Tắt' }}</span>
</span>
{% endif %}
