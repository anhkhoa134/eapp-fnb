<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    .auth-page {
        --primary-color: #17935a;
        --primary-hover: #107b49;
        --auth-ink: #0f172a;
        --auth-text: #334155;
        --auth-muted: #64748b;
        --auth-border: #d8dee6;
        --auth-link: #2563eb;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100vh;
        background:
            radial-gradient(circle at 88% 12%, rgba(23, 147, 90, 0.12), transparent 38%),
            radial-gradient(circle at 8% 92%, rgba(148, 163, 184, 0.14), transparent 40%),
            #f1f5f9 !important;
    }
    .auth-page .navbar {
        display: none !important;
    }
    .auth-page .auth-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Khung chính */
    .auth-card {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.18), 0 8px 20px -12px rgba(15, 23, 42, 0.1);
    }

    .auth-card-narrow {
        max-width: 480px;
    }
    .auth-simple-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.5rem;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--auth-ink);
        text-decoration: none;
    }
    .auth-simple-brand img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
    }

    /* Cột giới thiệu (trái) */
    .auth-showcase {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        color: #fff;
        background:
            radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.12), transparent 45%),
            linear-gradient(160deg, #11874f 0%, #1ba362 55%, #0f8f78 100%);
    }
    .auth-brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 1.75rem;
        font-size: 1.35rem;
        font-weight: 700;
        color: #fff;
    }
    .auth-brand img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }
    .auth-headline {
        font-size: clamp(1.7rem, 1.1rem + 1.8vw, 2.5rem);
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.01em;
        margin-bottom: 1rem;
    }
    .auth-lead {
        color: rgba(255, 255, 255, 0.86);
        font-size: 1rem;
        line-height: 1.6;
        max-width: 34rem;
        margin-bottom: 1.75rem;
    }
    .auth-feature {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.8rem 1rem;
        margin-bottom: 0.65rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-weight: 500;
        line-height: 1.45;
    }
    .auth-feature i {
        font-size: 1.1rem;
        line-height: 1.3;
        opacity: 0.9;
    }
    .auth-copyright {
        margin-top: auto;
        padding-top: 2rem;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.85rem;
    }

    /* Cột form (phải) */
    .auth-form-pane {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        color: var(--auth-text);
    }
    .auth-eyebrow {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--auth-muted);
        margin-bottom: 0.4rem;
    }
    .auth-title {
        font-size: clamp(1.5rem, 1.2rem + 0.9vw, 1.9rem);
        font-weight: 800;
        color: var(--auth-ink);
        letter-spacing: -0.01em;
        margin-bottom: 0.4rem;
    }
    .auth-subtitle {
        color: var(--auth-muted);
        margin-bottom: 0;
    }
    .auth-form .form-label {
        font-weight: 600;
        color: var(--auth-ink);
        margin-bottom: 0.4rem;
    }
    .auth-form .form-control {
        height: 48px;
        border: 1px solid var(--auth-border);
        border-radius: 10px;
        padding: 0 0.95rem;
        color: var(--auth-ink);
        background: #fff;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-form .form-control::placeholder {
        color: #94a3b8;
    }
    .auth-form .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(23, 147, 90, 0.15);
    }
    .auth-form .form-control.is-invalid {
        border-color: #dc2626;
    }
    .auth-form .form-text {
        color: var(--auth-muted);
        font-size: 0.8rem;
    }
    .auth-form .invalid-feedback {
        font-size: 0.82rem;
    }
    .auth-input-group .form-control {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
    }
    .auth-input-group .input-group-text {
        height: 48px;
        padding: 0 0.95rem;
        border: 1px solid var(--auth-border);
        border-radius: 0 10px 10px 0;
        background: #f1f5f9;
        color: var(--auth-text);
        font-weight: 600;
        user-select: none;
    }
    .auth-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.3rem 0.75rem;
        margin-bottom: 0.75rem;
        border-radius: 999px;
        background: rgba(23, 147, 90, 0.1);
        border: 1px solid rgba(23, 147, 90, 0.25);
        color: #0f7a4a;
        font-size: 0.8rem;
        font-weight: 600;
    }
    .auth-password {
        position: relative;
    }
    .auth-password .form-control {
        padding-right: 3rem;
    }
    .auth-password-toggle {
        position: absolute;
        top: 0;
        right: 0;
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--auth-muted);
        font-size: 1.1rem;
        border-radius: 10px;
    }
    .auth-password-toggle:hover,
    .auth-password-toggle:focus-visible {
        color: var(--auth-ink);
    }
    .auth-submit {
        height: 50px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1.02rem;
    }
    .auth-link {
        color: var(--auth-link);
        font-weight: 600;
        text-decoration: none;
    }
    .auth-link:hover {
        color: #1d4ed8;
        text-decoration: underline;
        text-underline-offset: 3px;
    }
    .auth-alert {
        border-radius: 10px;
        font-size: 0.9rem;
    }

    /* Tài khoản demo */
    .auth-demo {
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
        padding: 0.9rem 1.1rem;
    }
    .auth-demo-title {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--auth-text);
        margin-bottom: 0.35rem;
    }
    .auth-demo .demo-fill {
        display: block;
        width: calc(100% + 0.9rem);
        margin: 0 -0.45rem;
        padding: 0.25rem 0.45rem;
        text-align: left;
        font-size: 0.92rem;
        color: var(--auth-text);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
    }
    .auth-demo .demo-fill strong {
        color: var(--auth-ink);
    }
    .auth-demo .demo-fill:hover,
    .auth-demo .demo-fill:focus-visible {
        background: rgba(23, 147, 90, 0.1);
        border-color: rgba(23, 147, 90, 0.4);
        outline: none;
    }
    .auth-help {
        font-size: 0.88rem;
        color: var(--auth-muted);
        line-height: 1.6;
    }

    @media (max-width: 991.98px) {
        .auth-showcase .auth-headline {
            font-size: 1.6rem;
            margin-bottom: 0;
        }
        .auth-brand {
            margin-bottom: 1rem;
        }
    }
</style>
