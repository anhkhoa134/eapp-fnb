<div class="billing-plan-action">
  <button type="button" class="{{ button_class }}" data-billing-select="{{ key }}" data-label-month="{{ action.month.label }}" data-label-year="{{ action.year.label }}" data-disabled-month="{{ action.month.disabled|yesno:'true,false' }}" data-disabled-year="{{ action.year.disabled|yesno:'true,false' }}"{% if action.month.disabled %} disabled{% endif %}>{{ action.month.label }}</button>
  <small class="billing-current-caption" data-billing-caption="{{ key }}"{% if not action.caption %} hidden{% endif %}>{{ action.caption }}</small>
</div>
